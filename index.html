<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPortfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= LOGIN PAGE ================= -->

    <div id="loginPage" class="page">

        <div class="login-card">

            <div class="logo">
                MyPortfolio
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your portfolio
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <label>Login As</label>

                <select id="loginRole">

                    <option value="user">
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <p class="bottom-text">

                Don't have an account?

                <a href="#" onclick="showSignup()">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <!-- ================= SIGNUP PAGE ================= -->

    <div id="signupPage" class="page hidden">

        <div class="login-card">

            <div class="logo">
                MyPortfolio
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register as a user
            </p>

            <form id="signupForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required
                >

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>

            <p class="bottom-text">

                Already have an account?

                <a href="#" onclick="showLogin()">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- ================= ADMIN DASHBOARD ================= -->

    <div id="adminPage" class="hidden dashboard">

        <nav class="navbar">
